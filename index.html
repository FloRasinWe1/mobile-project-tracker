<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Project Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f5;color:#111827}
header{background:#0f172a;color:white;padding:24px 18px 20px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;color:#cbd5e1}
main{max-width:720px;margin:auto;padding:16px}
.new{width:100%;padding:16px;border:0;border-radius:14px;background:#2563eb;color:white;font-size:18px;font-weight:700;margin-bottom:12px}
.toolbar{display:flex;gap:8px;margin-bottom:18px}
.toolbar button{flex:1;padding:10px;border:0;border-radius:10px;background:#dbeafe;color:#1e40af;font-weight:700}
#connectionStatus{font-size:13px;margin:0 0 16px;padding:10px 12px;border-radius:10px;background:#e2e8f0;color:#334155}
#connectionStatus.ok{background:#dcfce7;color:#166534}
#connectionStatus.bad{background:#fee2e2;color:#991b1b}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:white;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px #0001}
.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#64748b}
.section-title{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin:20px 0 10px}
.section-title small{font-size:13px;color:#64748b;font-weight:500}
.card{background:white;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001;border-left:6px solid #94a3b8}
.card.side{border-color:#2563eb}.card.main{border-color:#16a34a}.card.emergency{border-color:#dc2626}
.card h3{margin:0 0 6px;font-size:18px;overflow-wrap:anywhere}
.meta{font-size:13px;color:#64748b;margin:4px 0;overflow-wrap:anywhere}
.progress{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:12px 0 6px}
.progress div{height:100%;background:#2563eb}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1;min-width:72px;padding:10px;border:0;border-radius:10px;font-weight:600;background:#e5e7eb}
.actions .complete{background:#16a34a;color:white}
.empty{text-align:center;color:#64748b;padding:18px;background:white;border-radius:14px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:15px;overflow:auto}
.modal-box{background:white;max-width:600px;margin:30px auto;border-radius:18px;padding:20px}
.modal h2{margin-top:0}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:white}
textarea{min-height:80px;resize:vertical}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-buttons button{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700}
.save{background:#2563eb;color:white}.cancel{background:#e5e7eb}
.completed{opacity:.75}.completed .progress div{background:#16a34a}
button:disabled{opacity:.55}
@media(max-width:400px){.summary{gap:6px}.stat{padding:11px 4px}.stat strong{font-size:19px}.section-title{font-size:18px}}
</style>
</head>
<body>
<header><h1>Project Tracker</h1><p>Projects • Progress • Time • Cost</p></header>
<main>
<button class="new" id="newProjectButton" onclick="openNewProject()">＋ New Project</button>
<div class="toolbar">
<button id="refreshButton" onclick="loadProjects()">↻ Refresh from Sheets</button>
</div>
<p id="connectionStatus">Connecting to Google Sheets…</p>
<div class="summary">
<div class="stat"><strong id="activeCount">0</strong><span>Active</span></div>
<div class="stat"><strong id="completedCount">0</strong><span>Completed</span></div>
<div class="stat"><strong id="totalCost">$0.00</strong><span>Actual Cost</span></div>
</div>
<div class="section-title">🔵 Side Projects <small id="sideCount">0</small></div><div id="sideProjects"></div>
<div class="section-title">🟢 Main Projects <small id="mainCount">0</small></div><div id="mainProjects"></div>
<div class="section-title">🔴 Emergency Projects <small id="emergencyCount">0</small></div><div id="emergencyProjects"></div>
<div class="section-title">✅ Completed</div><div id="completedProjects"></div>
</main>

<div class="modal" id="projectModal">
<div class="modal-box">
<h2 id="modalTitle">New Project</h2>
<label for="title">Project Title</label><input id="title" placeholder="Example: Basement Drainage" maxlength="250">
<label for="type">Project Type</label>
<select id="type">
<option value="side">Side Project — Low/Medium</option>
<option value="main">Main Project — High Priority</option>
<option value="emergency">Emergency Project</option>
</select>
<label for="notes">Description / Notes</label><textarea id="notes" placeholder="What needs to be done?"></textarea>
<label for="start">Start Date &amp; Time</label><input id="start" type="datetime-local">
<label for="estimatedCompletion">Estimated Completion</label><input id="estimatedCompletion" type="datetime-local">
<label for="estimatedCost">Estimated Cost ($)</label><input id="estimatedCost" type="number" min="0" step="0.01" placeholder="0">
<label for="progress">Progress (%)</label><input id="progress" type="number" min="0" max="100" value="0">
<div class="modal-buttons">
<button class="cancel" onclick="closeModal()">Cancel</button>
<button class="save" id="saveButton" onclick="saveProject()">Save Project</button>
</div>
</div>
</div>

<script>
// Replace this placeholder with the ORIGINAL deployed Apps Script URL ending in /exec.
const API_URL = "https://script.google.com/macros/s/AKfycbz17hWCsrRnOJWqRL4BgdrASi9dTqzPx21u_cM1J26_r3IGwo8YY3n8sQrVv2BYAAfBMw/exec";

let projects = [];
let editingId = null;
let busy = false;
let requestCounter = 0;

function setStatus(message, state="") {
const el = document.getElementById("connectionStatus");
el.textContent = message;
el.className = state;
}

function apiRequest(params) {
return new Promise((resolve, reject) => {
if (!API_URL || API_URL.includes("PASTE_YOUR_APPS_SCRIPT")) {
reject(new Error("Add your Apps Script /exec URL to API_URL."));
return;
}

const callbackName = "__projectTrackerCallback_" + Date.now() + "_" + (++requestCounter);
const script = document.createElement("script");
let finished = false;

const cleanup = () => {
if (script.parentNode) script.parentNode.removeChild(script);
try { delete window[callbackName]; }
catch (_) { window[callbackName] = undefined; }
};

const timeout = setTimeout(() => {
if (finished) return;
finished = true;
cleanup();
reject(new Error("The API did not respond. Check the URL and try Refresh."));
}, 20000);

window[callbackName] = data => {
if (finished) return;
finished = true;
clearTimeout(timeout);
cleanup();

if (!data || data.success !== true) {
reject(new Error(data && data.error ? data.error : "Unexpected API response."));
} else {
resolve(data);
}
};

const url = new URL(API_URL);
Object.entries(params).forEach(([key,value]) => {
if (value !== undefined && value !== null) url.searchParams.set(key,String(value));
});
url.searchParams.set("callback",callbackName);
url.searchParams.set("_",String(Date.now()));

script.onerror = () => {
if (finished) return;
finished = true;
clearTimeout(timeout);
cleanup();
reject(new Error("Could not load the API response. Check the deployed /exec URL."));
};

script.src = url.toString();
document.head.appendChild(script);
});
}

function fromSheet(row) {
const get = key => row[key];
const date = value => value ? String(value) : "";
const num = value => Number(value || 0);
const status = String(get("Status") || "");
const progress = num(get("Progress"));
const actualCompletion = date(get("Actual Completion"));
const completed = progress >= 100 || /completed/i.test(status) || Boolean(actualCompletion);

return {
id:String(get("ID")),
type:String(get("Type") || "side").toLowerCase(),
title:String(get("Title") || ""),
start:date(get("Start Time")),
progress:Math.max(0,Math.min(100,progress)),
status:status || (completed ? "Completed" : "In Progress"),
estimatedCompletion:date(get("Estimated Completion")),
actualCompletion,
estimatedCost:num(get("Estimated Cost")),
actualCost:num(get("Actual Cost")),
notes:String(get("Notes") || ""),
completed
};
}

async function loadProjects() {
const refresh = document.getElementById("refreshButton");
refresh.disabled = true;
setStatus("Loading projects from Google Sheets…");

try {
const response = await apiRequest({action:"list"});
projects = (response.projects || []).map(fromSheet);
render();
setStatus("Connected to Google Sheets • " + projects.length + " project(s) loaded","ok");
} catch (error) {
setStatus("Connection error: " + error.message,"bad");
} finally {
refresh.disabled = false;
}
}

function money(value) {
return "$" + Number(value || 0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function formatDate(value) {
if (!value) return "Not set";
const d = new Date(value);
if (Number.isNaN(d.getTime())) return "Not set";
return d.toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
}

function inputDate(value) {
if (!value) return "";
const d = new Date(value);
if (Number.isNaN(d.getTime())) return "";
const pad = n => String(n).padStart(2,"0");
return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function dateForApi(value) {
if (!value) return "";
const d = new Date(value);
return Number.isNaN(d.getTime()) ? "" : d.toISOString();
}

function openNewProject() {
editingId = null;
document.getElementById("modalTitle").textContent = "New Project";
document.getElementById("title").value = "";
document.getElementById("type").value = "side";
document.getElementById("notes").value = "";
document.getElementById("start").value = inputDate(new Date().toISOString());
document.getElementById("estimatedCompletion").value = "";
document.getElementById("estimatedCost").value = "";
document.getElementById("progress").value = "0";
document.getElementById("projectModal").style.display = "block";
}

function closeModal() {
document.getElementById("projectModal").style.display = "none";
}

function setBusy(value) {
busy = value;
document.getElementById("saveButton").disabled = value;
document.getElementById("newProjectButton").disabled = value;
}

async function saveProject() {
if (busy) return;

const title = document.getElementById("title").value.trim();
if (!title) { alert("Please enter a project title."); return; }

const progress = Number(document.getElementById("progress").value || 0);
const estimatedCost = Number(document.getElementById("estimatedCost").value || 0);

if (!Number.isFinite(progress) || progress < 0 || progress > 100) {
alert("Progress must be between 0 and 100.");
return;
}
if (!Number.isFinite(estimatedCost) || estimatedCost < 0) {
alert("Estimated cost must be zero or greater.");
return;
}

const fields = {
title,
type:document.getElementById("type").value,
notes:document.getElementById("notes").value,
startTime:dateForApi(document.getElementById("start").value),
estimatedCompletion:dateForApi(document.getElementById("estimatedCompletion").value),
estimatedCost,
progress,
status:progress >= 100 ? "Completed" : (progress > 0 ? "In Progress" : "Not Started")
};

setBusy(true);
setStatus(editingId !== null ? "Updating project in Google Sheets…" : "Saving project to Google Sheets…");

try {
if (editingId !== null) {
await apiRequest({action:"update",id:editingId,...fields});
} else {
await apiRequest({action:"create",...fields});
}
closeModal();
await loadProjects();
} catch (error) {
setStatus("Save failed: " + error.message,"bad");
alert("Project was not saved to Google Sheets.\n\n" + error.message);
} finally {
setBusy(false);
}
}

function editProject(id) {
const p = projects.find(x => String(x.id) === String(id));
if (!p) return;

editingId = p.id;
document.getElementById("modalTitle").textContent = "Edit Project";
document.getElementById("title").value = p.title;
document.getElementById("type").value = p.type;
document.getElementById("notes").value = p.notes;
document.getElementById("start").value = inputDate(p.start);
document.getElementById("estimatedCompletion").value = inputDate(p.estimatedCompletion);
document.getElementById("estimatedCost").value = p.estimatedCost;
document.getElementById("progress").value = p.progress;
document.getElementById("projectModal").style.display = "block";
}

async function completeProject(id) {
const p = projects.find(x => String(x.id) === String(id));
if (!p) return;

const cost = prompt("Enter the actual project cost:",p.estimatedCost || 0);
if (cost === null) return;

const actualCost = Number(cost);
if (!Number.isFinite(actualCost) || actualCost < 0) {
alert("Enter a valid cost of zero or greater.");
return;
}

setStatus("Completing project in Google Sheets…");
try {
await apiRequest({
action:"update",
id:p.id,
progress:100,
status:"Completed",
actualCost,
actualCompletion:new Date().toISOString()
});
await loadProjects();
} catch (error) {
setStatus("Could not complete project: " + error.message,"bad");
alert("Project was not updated.\n\n" + error.message);
}
}

async function deleteProject(id) {
const p = projects.find(x => String(x.id) === String(id));
if (!p || !confirm(`Delete "${p.title}" from Google Sheets? This cannot be undone.`)) return;

setStatus("Deleting project from Google Sheets…");
try {
await apiRequest({action:"delete",id:p.id});
await loadProjects();
} catch (error) {
setStatus("Delete failed: " + error.message,"bad");
alert("Project was not deleted.\n\n" + error.message);
}
}

function projectCard(p) {
const cls = ["side","main","emergency"].includes(p.type) ? p.type : "side";
const progress = Math.max(0,Math.min(100,Number(p.progress)||0));

return `
<div class="card ${cls} ${p.completed?"completed":""}">
<h3>${escapeHTML(p.title)}</h3>
<div class="meta">${p.notes ? escapeHTML(p.notes) : "No description"}</div>
<div class="progress"><div style="width:${progress}%"></div></div>
<div class="row"><span>Progress</span><strong>${progress}%</strong></div>
<div class="row"><span>Estimated Cost</span><strong>${money(p.estimatedCost)}</strong></div>
${p.completed
? `<div class="row"><span>Actual Cost</span><strong>${money(p.actualCost)}</strong></div>
<div class="meta">Completed: ${formatDate(p.actualCompletion)}</div>`
: `<div class="meta">Started: ${formatDate(p.start)}</div>
<div class="meta">Est. completion: ${formatDate(p.estimatedCompletion)}</div>`}
<div class="actions">
<button onclick="editProject(${JSON.stringify(String(p.id))})">Edit</button>
${p.completed ? "" : `<button class="complete" onclick="completeProject(${JSON.stringify(String(p.id))})">Complete</button>`}
<button onclick="deleteProject(${JSON.stringify(String(p.id))})">Delete</button>
</div>
</div>`;
}

function renderSection(id,type) {
const container = document.getElementById(id);
const list = projects.filter(p => p.type === type && !p.completed);
container.innerHTML = list.length ? list.map(projectCard).join("") : '<div class="empty">No active projects</div>';
}

function render() {
renderSection("sideProjects","side");
renderSection("mainProjects","main");
renderSection("emergencyProjects","emergency");

const completed = projects.filter(p => p.completed);
document.getElementById("completedProjects").innerHTML = completed.length
? completed.map(projectCard).join("")
: '<div class="empty">No completed projects yet</div>';

const active = projects.filter(p => !p.completed);
document.getElementById("activeCount").textContent = active.length;
document.getElementById("completedCount").textContent = completed.length;
document.getElementById("totalCost").textContent = money(projects.reduce((sum,p)=>sum+(Number(p.actualCost)||0),0));
document.getElementById("sideCount").textContent = projects.filter(p=>p.type==="side"&&!p.completed).length;
document.getElementById("mainCount").textContent = projects.filter(p=>p.type==="main"&&!p.completed).length;
document.getElementById("emergencyCount").textContent = projects.filter(p=>p.type==="emergency"&&!p.completed).length;
}

function escapeHTML(str) {
return String(str||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

document.getElementById("projectModal").addEventListener("click",event=>{
if (event.target.id === "projectModal") closeModal();
});

loadProjects();
</script>
</body>
</html>
